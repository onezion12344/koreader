name: android-build

on:
  push:
    branches: [feature/onedrive-integration]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (arm64, arm, x86)'
        required: true
        default: 'arm64'

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - android-arm64
          - android-arm
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0 ndk;27.1.12297006'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file gettext git nasm pkg-config unzip wget autoconf automake libtool cmake ninja-build

      - name: Fetch third-party dependencies
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006
          export ANDROID_NDK=$ANDROID_NDK_HOME
          make TARGET=${{ matrix.target }} fetchthirdparty

      - name: Build KOReader
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006
          export ANDROID_NDK=$ANDROID_NDK_HOME
          export PATH=$JAVA_HOME/bin:$PATH
          make TARGET=${{ matrix.target }} all VERBOSE=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koreader-${{ matrix.target }}
          path: |
            build/*.apk
            koreader-*.apk
            platform/android/luajit-launcher/build/outputs/apk/**/*.apk
          if-no-files-found: warn
