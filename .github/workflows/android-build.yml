name: android-build

on:
  push:
    branches: [feature/onedrive-integration]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file gettext git nasm pkg-config unzip wget autoconf automake libtool cmake ninja-build
          pip install meson

      - name: Setup NDK r23c
        run: |
          NDK_DIR="${{ github.workspace }}/toolchain/android-ndk-r23c"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK r23c..."
            wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip -O /tmp/ndk.zip
            mkdir -p "$(dirname "$NDK_DIR")"
            unzip -q /tmp/ndk.zip -d "$(dirname "$NDK_DIR")"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Android SDK
        run: |
          SDK_DIR="${{ github.workspace }}/toolchain/android-sdk-linux"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Setting up minimal Android SDK..."
            mkdir -p "$SDK_DIR"
            # Use runner SDK if available, otherwise download minimal cmdline-tools
            if [ -d "$ANDROID_SDK_ROOT" ]; then
              # Copy just what we need from the pre-installed SDK
              cp -r "$ANDROID_SDK_ROOT/platforms" "$SDK_DIR/" 2>/dev/null || true
              cp -r "$ANDROID_SDK_ROOT/build-tools" "$SDK_DIR/" 2>/dev/null || true
              cp -r "$ANDROID_SDK_ROOT/platform-tools" "$SDK_DIR/" 2>/dev/null || true
              cp -r "$ANDROID_SDK_ROOT/tools" "$SDK_DIR/" 2>/dev/null || true
              cp -r "$ANDROID_SDK_ROOT/cmdline-tools" "$SDK_DIR/" 2>/dev/null || true
            fi
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

      - name: Build KOReader Android (arm64)
        run: |
          ANDROID=1 make TARGET=android-arm64 release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koreader-onedrive-arm64
          path: |
            build/*.apk
            koreader-*.apk
            platform/android/luajit-launcher/build/outputs/apk/**/*.apk
          if-no-files-found: warn
