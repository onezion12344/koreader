name: android-build

on:
  push:
    branches: [feature/onedrive-integration, feature/onedrive-advanced]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file gettext git nasm pkg-config unzip wget autoconf automake libtool cmake ninja-build
          pip install meson

      - name: Setup NDK r23c
        run: |
          NDK_DIR="${{ github.workspace }}/toolchain/android-ndk-r23c"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK r23c..."
            wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip -O /tmp/ndk.zip
            mkdir -p "$(dirname "$NDK_DIR")"
            unzip -q /tmp/ndk.zip -d "$(dirname "$NDK_DIR")"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Android SDK
        run: |
          # Use runner's pre-installed SDK (has licenses accepted)
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Accept any remaining licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build KOReader Android (arm64)
        run: |
          ./kodev release android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koreader-onedrive-arm64
          path: |
            build/*.apk
            koreader-*.apk
            platform/android/luajit-launcher/build/outputs/apk/**/*.apk
          if-no-files-found: warn
